name: Apply JayTree PWA

on:
  workflow_run:
    workflows:
      - "Build Reader Growth Site"
      - "Normalize Homepage"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jaytree-pwa
  cancel-in-progress: true

jobs:
  apply-pwa:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install icon generator
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Apply installable PWA support
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          python scripts/apply_pwa.py
          python scripts/apply_custom_pwa_icon.py

      - name: Validate PWA
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path(".")
          manifest = json.loads((root / "manifest.webmanifest").read_text(encoding="utf-8"))
          assert manifest["name"] == "JayTree Books"
          assert manifest["short_name"] == "JayTree"
          assert manifest["start_url"] == "/"
          assert manifest["scope"] == "/"
          assert manifest["display"] == "standalone"
          sizes = {entry["sizes"] for entry in manifest["icons"]}
          assert "192x192" in sizes and "512x512" in sizes
          assert all("publisher-logo-1" in entry["src"] for entry in manifest["icons"])

          for filename, expected in (
              ("icon-192.png", (192, 192)),
              ("icon-512.png", (512, 512)),
              ("apple-touch-icon.png", (180, 180)),
          ):
              with Image.open(root / "icons" / filename) as image:
                  assert image.size == expected, (filename, image.size)

          service_worker = (root / "service-worker.js").read_text(encoding="utf-8")
          assert 'jaytree-pwa-v2' in service_worker
          assert 'publisher-logo-1' in service_worker
          assert (root / "pwa.js").exists()
          assert (root / "pwa.css").exists()

          targets = set(root.glob("*.html"))
          for folder in ("books", "chapters", "audio"):
              directory = root / folder
              if directory.exists():
                  targets.update(directory.glob("*.html"))

          assert targets
          for path in targets:
              html = path.read_text(encoding="utf-8")
              assert '<link rel="manifest" href="/manifest.webmanifest">' in html, path
              assert '<script src="/pwa.js" defer></script>' in html, path

          print(f"Validated JayTree PWA across {len(targets)} HTML pages with the publisher logo icon.")
          PY

      - name: Commit generated PWA assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.webmanifest service-worker.js pwa.js pwa.css icons
          git add -- '*.html' 'books/*.html' 'chapters/*.html' 'audio/*.html'

          if git diff --cached --quiet; then
            echo "JayTree PWA is already current."
            exit 0
          fi

          git commit -m "Update JayTree Books app icon"
          git push origin main
