name: Sync YouTube Website

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: youtube-website-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sync scripts
        run: |
          python -m py_compile scripts/sync_youtube_uploads.py
          python -m py_compile scripts/reconcile_mystery_cases.py

      - name: Sync new YouTube uploads into website registry
        run: python scripts/sync_youtube_uploads.py

      - name: Reconcile Mystery Case classification and homepage
        run: python scripts/reconcile_mystery_cases.py

      - name: Keep book trailer URLs controlled by website config
        shell: bash
        run: |
          git restore config.js

      - name: Validate registry
        run: python -m json.tool data/youtube-sync.json > /dev/null

      - name: Commit website video updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-sync.json index.html

          if git diff --cached --quiet; then
            echo "No new YouTube website updates."
            exit 0
          fi

          git commit -m "Sync latest YouTube registry and Mystery Challenge"
          git pull --rebase origin main
          git push origin main

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## YouTube → Website Sync"
            echo ""
            echo "- Checks @JayTreeBooks every 15 minutes"
            echo "- Records matching uploads in the YouTube registry"
            echo "- Reconciles full Mystery Case, teaser, and reveal classification"
            echo "- Does not overwrite curated book trailer URLs in config.js"
            echo "- Animated-series trailers remain separate from book trailers"
            echo "- Mystery Case uploads update the homepage challenge automatically"
            echo "- Mystery Reveal uploads can switch the homepage to the reveal"
          } >> "$GITHUB_STEP_SUMMARY"
