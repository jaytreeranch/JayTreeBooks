name: Configure Kit Newsletter Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/configure-kit-newsletter-once.yml"

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure JayTree Case Files Kit form
        shell: bash
        run: |
          cat > /tmp/kit_embed.txt <<'EOF'
          <script async data-uid="45491fc29e" src="https://jaytree-books.kit.com/45491fc29e/index.js"></script>
          EOF
          python scripts/configure_kit_newsletter.py --embed-file /tmp/kit_embed.txt

      - name: Commit Kit configuration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js
          git commit -m "Switch JayTree Case Files to Kit"
          git push
