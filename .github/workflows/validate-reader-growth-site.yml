name: Validate Reader Growth Site
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python scripts/build_storefront_catalog.py --check
      - run: python scripts/build_sitewide_preview.py --check
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.test.js tests/*.test.cjs
      - name: Build with the GitHub Pages renderer
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: python scripts/qc_published_storefront.py _site
