name: Validate Reader Growth Site

on:
  pull_request:
    paths:
      - "scripts/build_reader_growth_site.py"
      - "scripts/finalize_reader_growth.py"
      - "scripts/apply_newsletter_provider.py"
      - "scripts/configure_kit_newsletter.py"
      - "scripts/add_audiobook_coming_soon.py"
      - "scripts/apply_site_improvements.py"
      - "config.js"
      - "app.js"
      - "index.html"
      - "book.html"
      - "books/*.html"
      - "case-files*.html"
      - "styles.css"
      - "video-lite.js"
      - "data/case-files-welcome-sequence.md"
      - "docs/kit-case-files-setup.md"
      - "images/*.png"
      - "chapters/*.html"
      - ".github/workflows/build-reader-growth-site.yml"
      - ".github/workflows/validate-reader-growth-site.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image optimizer
        run: python -m pip install Pillow

      - name: Compile generators
        run: |
          python -m py_compile scripts/build_reader_growth_site.py
          python -m py_compile scripts/finalize_reader_growth.py
          python -m py_compile scripts/apply_newsletter_provider.py
          python -m py_compile scripts/configure_kit_newsletter.py
          python -m py_compile scripts/add_audiobook_coming_soon.py
          python -m py_compile scripts/apply_site_improvements.py

      - name: Generate site in CI workspace
        run: |
          python scripts/build_reader_growth_site.py
          python scripts/finalize_reader_growth.py
          python scripts/apply_newsletter_provider.py
          python scripts/add_audiobook_coming_soon.py
          python scripts/apply_site_improvements.py

      - name: Validate conversion, SEO, social, image, video, and Case Files outputs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          config_text = (root / 'config.js').read_text(encoding='utf-8')
          match = re.search(r'window\.JT\s*=\s*(\{.*?\});\s*window\.JAYTREE_CONFIG', config_text, re.S)
          assert match
          config = json.loads(match.group(1))
          books = config['books']
          newsletter = config['newsletter']
          provider = newsletter.get('provider', 'formsubmit')
          assert len(books) == 5
          assert newsletter['name'] == 'JayTree Case Files'
          assert provider in {'formsubmit', 'kit'}
          assert newsletter['kit']['formName'] == 'JayTree Case Files'
          assert newsletter['kit']['sequenceName'] == 'JayTree Case Files Welcome'
          if provider == 'formsubmit':
              assert newsletter['formAction'].startswith('https://formsubmit.co/')
          else:
              assert newsletter['kit']['embedCode']

          for book in books:
              page = root / 'books' / f"{book['slug']}.html"
              html = page.read_text(encoding='utf-8')
              assert f'<link rel="canonical" href="https://www.JayTreeBooks.com/books/{book["slug"]}.html">' in html
              assert '"@type":"Book"' in html
              assert 'Read FREE with Kindle Unlimited' in html
              assert book['amazonUrl'] in html
              assert 'id="listen"' in html
              assert 'Full Audiobook — Coming Soon' in html
              assert 'video-lite' in html
              assert '../video-lite.js' in html
              assert 'src="https://www.youtube-nocookie.com/embed/' not in html
              assert '../privacy.html' in html and '../terms.html' in html
              original = book.get('coverOriginal') or book['cover']
              assert f'<meta property="og:image" content="https://www.JayTreeBooks.com/{original}">' in html
              assert f'<meta name="twitter:image" content="https://www.JayTreeBooks.com/{original}">' in html

              chapter_html = (root / book['chapter']).read_text(encoding='utf-8')
              assert 'Continue FREE with Kindle Unlimited' in chapter_html
              assert f'../books/{book["slug"]}.html' in chapter_html
              assert 'JAYTREE_CHAPTER_ANALYTICS_START' in chapter_html
              assert 'JAYTREE_2026_READER_ACCESSIBILITY' in chapter_html
              assert 'Jaytree Books' not in chapter_html

              cover = root / book['cover']
              assert cover.exists()
              assert cover.suffix == '.webp'
              assert cover.stat().st_size < 1_000_000

          index = (root / 'index.html').read_text(encoding='utf-8')
          assert '"@type":"Organization"' in index
          assert 'Follow JayTree Books' in index
          assert 'https://x.com/JayTreeBooks' in index
          assert 'https://www.tiktok.com/@jaytreebooks' in index
          assert 'JAYTREE_CASE_FILES_START' in index
          assert 'JAYTREE_SOCIAL_FOLLOW_START' in index
          assert '<link rel="canonical" href="https://www.JayTreeBooks.com/">' in index
          assert 'JayTree Books | Mystery Thrillers, Kindle Unlimited & Mystery Challenges' in index
          assert 'Five mysteries. Read them all with Kindle Unlimited.' in index
          assert index.index('id="kindle-unlimited"') < index.index('id="books"')
          assert 'continue the story on Audible' not in index
          assert '<script src="video-lite.js"></script>' in index
          assert 'privacy.html' in index and 'terms.html' in index
          if provider == 'formsubmit':
              assert 'Open the Case Files' in index
          else:
              assert 'case-files-kit-form' in index
              assert newsletter['kit']['embedCode'] in index

          case_files = (root / 'case-files.html').read_text(encoding='utf-8')
          assert '<link rel="canonical" href="https://www.JayTreeBooks.com/case-files.html">' in case_files
          assert 'Get the next mystery before the reveal.' in case_files
          assert 'data-case-files-form' in case_files
          assert 'case_files_signup_view' in case_files
          assert 'privacy.html' in case_files and 'terms.html' in case_files
          if provider == 'formsubmit':
              assert 'name="_autoresponse"' in case_files
              assert 'name="_honey"' in case_files
          else:
              assert 'case-files-kit-form' in case_files
              assert newsletter['kit']['embedCode'] in case_files

          thanks = (root / 'case-files-thanks.html').read_text(encoding='utf-8')
          assert 'name="robots" content="noindex,follow"' in thanks
          assert 'case_files_signup_complete' in thanks
          if provider == 'kit':
              assert "{source:'kit'}" in thanks

          app = (root / 'app.js').read_text(encoding='utf-8')
          assert 'href="books/${b.slug}.html"' in app
          assert 'books/${b.slug}.html#listen' in app
          assert 'href="books/${featured.slug}.html"' in app
          assert 'loading="lazy" decoding="async"' in app
          assert 'track("social_visit"' in app
          assert '[data-event]' in app
          assert 'video-lite-inner' in app
          assert 'case_files_signup_submit' in app

          video_loader = (root / 'video-lite.js').read_text(encoding='utf-8')
          assert 'video_play' in video_loader
          assert 'video_youtube_fallback' in video_loader
          assert 'aria-expanded' in video_loader

          assert (root / 'data/case-files-welcome-sequence.md').exists()
          assert (root / 'docs/kit-case-files-setup.md').exists()
          assert "You're in the JayTree Case Files" in (root / 'data/case-files-welcome-sequence.md').read_text(encoding='utf-8')

          legacy = (root / 'book.html').read_text(encoding='utf-8')
          assert 'name="robots" content="noindex,follow"' in legacy
          assert 'privacy.html' in legacy and 'terms.html' in legacy

          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          for book in books:
              assert f'https://www.JayTreeBooks.com/books/{book["slug"]}.html' in sitemap
              assert f'https://www.JayTreeBooks.com/{book["chapter"]}' in sitemap
          assert 'https://www.JayTreeBooks.com/case-files.html' in sitemap
          assert 'Sitemap: https://www.JayTreeBooks.com/sitemap.xml' in (root / 'robots.txt').read_text(encoding='utf-8')
          print(f'Reader growth and durable JayTree site improvements validation passed with provider={provider}.')
          PY
