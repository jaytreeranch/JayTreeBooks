name: Build Reader Growth Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/storefront-catalog.json"
      - "scripts/build_storefront_catalog.py"
      - "scripts/build_sitewide_preview.py"
      - "chapters/*.html"
      - "audio/*.html"
      - "books/*.html"
      - "about.html"
      - ".github/workflows/build-reader-growth-site.yml"

permissions:
  contents: write

concurrency:
  group: jaytree-reader-growth-site
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image optimizer
        run: python -m pip install Pillow

      - name: Rebuild storefront and reader navigation
        run: |
          python scripts/build_storefront_catalog.py --write
          python scripts/build_sitewide_preview.py --write
          python scripts/build_storefront_catalog.py --check
          python -m unittest discover -s tests
          node --test tests/*.test.js tests/*.test.cjs

      - name: Save regenerated pages
        run: |
          git add -- '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh JayTree storefront from the current catalog"
          git pull --rebase origin main
          git push
