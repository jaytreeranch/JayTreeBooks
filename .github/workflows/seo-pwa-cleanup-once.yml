name: One-time SEO PWA Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seo-pwa-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove duplicate PWA markup and validate SEO pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          head_start = '<!-- JAYTREE_PWA_HEAD_START -->'
          head_end = '<!-- JAYTREE_PWA_HEAD_END -->'
          script_start = '<!-- JAYTREE_PWA_SCRIPT_START -->'
          script_end = '<!-- JAYTREE_PWA_SCRIPT_END -->'

          canonical_head = '''<!-- JAYTREE_PWA_HEAD_START -->
          <link rel="manifest" href="/manifest.webmanifest">
          <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=publisher-logo-3">
          <meta name="theme-color" content="#080d12">
          <meta name="application-name" content="JayTree Books">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="JayTree Books">
          <link rel="stylesheet" href="/pwa.css">
          <!-- JAYTREE_PWA_HEAD_END -->'''
          canonical_script = '''<!-- JAYTREE_PWA_SCRIPT_START -->
          <script src="/pwa.js" defer></script>
          <!-- JAYTREE_PWA_SCRIPT_END -->'''

          head_re = re.compile(re.escape(head_start) + r'.*?' + re.escape(head_end), re.S)
          script_re = re.compile(re.escape(script_start) + r'.*?' + re.escape(script_end), re.S)

          targets = set(root.glob('*.html'))
          for folder in ('books', 'chapters', 'audio'):
              d = root / folder
              if d.exists():
                  targets.update(d.glob('*.html'))

          changed = []
          for path in sorted(targets):
              text = path.read_text(encoding='utf-8')
              original = text

              # Protect one canonical managed block while removing unmanaged duplicates.
              text = head_re.sub('__JT_PWA_HEAD__', text)
              text = script_re.sub('__JT_PWA_SCRIPT__', text)

              cleanup_patterns = [
                  r'\s*<link\b[^>]*rel=["\']manifest["\'][^>]*href=["\']/manifest\.webmanifest["\'][^>]*>\s*',
                  r'\s*<link\b[^>]*rel=["\']apple-touch-icon["\'][^>]*>\s*',
                  r'\s*<link\b[^>]*rel=["\']stylesheet["\'][^>]*href=["\']/pwa\.css["\'][^>]*>\s*',
                  r'\s*<meta\b[^>]*name=["\']theme-color["\'][^>]*>\s*',
                  r'\s*<meta\b[^>]*name=["\']application-name["\'][^>]*>\s*',
                  r'\s*<meta\b[^>]*name=["\']apple-mobile-web-app-capable["\'][^>]*>\s*',
                  r'\s*<meta\b[^>]*name=["\']apple-mobile-web-app-status-bar-style["\'][^>]*>\s*',
                  r'\s*<meta\b[^>]*name=["\']apple-mobile-web-app-title["\'][^>]*>\s*',
                  r'\s*<script\b[^>]*src=["\']/pwa\.js["\'][^>]*>\s*</script>\s*',
              ]
              for pattern in cleanup_patterns:
                  text = re.sub(pattern, '\n', text, flags=re.I)

              if '__JT_PWA_HEAD__' in text:
                  text = text.replace('__JT_PWA_HEAD__', canonical_head, 1)
              elif '</head>' in text:
                  text = text.replace('</head>', canonical_head + '\n</head>', 1)

              if '__JT_PWA_SCRIPT__' in text:
                  text = text.replace('__JT_PWA_SCRIPT__', canonical_script, 1)
              elif '</body>' in text:
                  text = text.replace('</body>', canonical_script + '\n</body>', 1)

              # Repair the Hollow Bell Short thumbnail URL caught during SEO QC.
              text = text.replace(
                  'https://i.ytimg.com/vi/V8GWIIuTbx4"',
                  'https://i.ytimg.com/vi/V8GWIIuTbx4/hqdefault.jpg"'
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # Validate every managed HTML page has exactly one PWA include of each kind.
          for path in sorted(targets):
              html = path.read_text(encoding='utf-8')
              assert html.count('rel="manifest" href="/manifest.webmanifest"') == 1, path
              assert html.count('href="/pwa.css"') == 1, path
              assert html.count('src="/pwa.js" defer') == 1, path
              assert html.count(head_start) == 1 and html.count(head_end) == 1, path
              assert html.count(script_start) == 1 and html.count(script_end) == 1, path

          hollow = (root / 'books' / 'the-hollow-bell.html').read_text(encoding='utf-8')
          assert 'https://i.ytimg.com/vi/V8GWIIuTbx4/hqdefault.jpg' in hollow
          assert (root / 'mystery-books.html').exists()
          assert 'https://www.JayTreeBooks.com/mystery-books.html' in (root / 'sitemap.xml').read_text(encoding='utf-8')
          print(f'Cleaned/validated {len(targets)} HTML pages; changed {len(changed)} files.')
          for item in changed:
              print(item)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'books/*.html' 'chapters/*.html' 'audio/*.html'
          if git diff --cached --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git commit -m "Clean SEO PWA markup after discoverability update"
          git push origin main
