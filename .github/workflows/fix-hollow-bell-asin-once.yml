name: One-time Hollow Bell ASIN Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-hollow-bell-asin-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace outdated Kindle ASIN
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "B0HD5RH8X5"
          new = "B0HD2H8586"
          allowed = {'.html', '.js', '.json', '.md', '.txt', '.xml', '.yml', '.yaml'}
          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in allowed:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old in text:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(p))
          print('Updated:', changed)
          if not changed:
              raise SystemExit('No outdated ASIN references found')
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct The Hollow Bell Kindle ASIN"
          git push origin main
