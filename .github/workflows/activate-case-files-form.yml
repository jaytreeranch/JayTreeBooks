name: Activate Case Files Form

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/activate-case-files-form.yml"

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger FormSubmit confirmation email
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl -L -sS -o "$response_file" -w '%{http_code}' \
            -X POST \
            --data-urlencode 'email=activation-test@invalid.example' \
            --data-urlencode 'consent=Activation test only' \
            --data-urlencode 'list=JayTree Case Files' \
            --data-urlencode 'source=github-one-time-activation' \
            --data-urlencode '_subject=JayTree Case Files form activation test' \
            --data-urlencode '_captcha=false' \
            https://formsubmit.co/jaytreebooks@gmail.com)"
          echo "FormSubmit HTTP status: $http_code"
          test "$http_code" -ge 200 -a "$http_code" -lt 400
