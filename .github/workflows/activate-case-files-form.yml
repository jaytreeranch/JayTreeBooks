name: Activate Case Files Form

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/activate-case-files-form.yml"

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger FormSubmit confirmation email
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"email":"activation-test@invalid.example","consent":"Activation test only","list":"JayTree Case Files","source":"github-one-time-activation"}' \
            https://formsubmit.co/ajax/jaytreebooks@gmail.com)"
          echo "FormSubmit activation request completed with HTTP status: $http_code"
          test -n "$http_code"
