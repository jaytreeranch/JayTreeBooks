name: Sync Weekly Campaign Metadata

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional America/Chicago date (YYYY-MM-DD); leave blank for current week"
        required: false
        default: ""
        type: string
  push:
    branches: ["main"]
    paths:
      - "data/campaign.json"
      - "scripts/update_campaign_featured.py"
      - ".github/workflows/sync-campaign-metadata.yml"
  schedule:
    - cron: "0 8 * * 1"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  group: weekly-campaign-metadata
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize weekly featured-book fallback
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_DATE" ]]; then
            python scripts/update_campaign_featured.py --date "$REQUESTED_DATE"
          else
            python scripts/update_campaign_featured.py
          fi

      - name: Validate publisher-focused homepage SEO
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert '<title>JayTree Books | Mystery Thrillers, Kindle Unlimited & Mystery Challenges</title>' in text
          assert '<link rel="canonical" href="https://www.JayTreeBooks.com/">' in text
          assert "THIS WEEK'S FEATURED MYSTERY" in text
          print('Weekly fallback updated without replacing publisher SEO metadata.')
          PY

      - name: Commit synchronized homepage fallback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html config.js
          if git diff --cached --quiet; then
            echo "Campaign featured fallback is already synchronized."
            exit 0
          fi
          git commit -m "Sync weekly featured book fallback"
          git pull --rebase origin main
          git push

      - name: Summarize campaign metadata
        shell: bash
        run: |
          {
            echo "## Weekly website campaign feature"
            echo ""
            echo "The homepage featured-book fallback and config were synchronized from data/campaign.json."
            echo "Publisher-focused homepage SEO title and social metadata remain stable."
          } >> "$GITHUB_STEP_SUMMARY"
