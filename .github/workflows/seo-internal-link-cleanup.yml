name: SEO Internal Link Cleanup

on:
  push:
    paths:
      - '.github/workflows/seo-internal-link-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strengthen static SEO links
        shell: python
        run: |
          from pathlib import Path
          import re

          book_files = [
              Path('books/second-draft.html'),
              Path('books/the-hollow-year.html'),
              Path('books/the-hollow-bell.html'),
              Path('books/the-absconding.html'),
              Path('books/the-correction.html'),
          ]
          psych_files = {
              'second-draft.html',
              'the-absconding.html',
              'the-correction.html',
          }

          nav_old = '<nav class="nav-links"><a href="../mystery-books.html">Mystery Books</a><a href="../index.html#books">All Books</a>'
          nav_new = '<nav class="nav-links"><a href="../mystery-books.html">New Mystery Books</a><a href="../psychological-mystery-books.html">Psychological</a><a href="../kindle-unlimited-mystery-books.html">Kindle Unlimited</a><a href="../index.html#books">All Books</a>'

          footer_old = '<div class="footer-links"><a href="../mystery-books.html">Mystery Books</a> · <a href="../index.html#books">All Books</a> · <a href="../index.html#challenge">Challenge</a> · <a href="../privacy.html">Privacy</a> · <a href="../terms.html">Terms</a></div>'
          footer_new = '<div class="footer-links"><a href="../mystery-books.html">New Mystery Books</a> · <a href="../psychological-mystery-books.html">Psychological Mystery Books</a> · <a href="../kindle-unlimited-mystery-books.html">Kindle Unlimited Mystery Books</a> · <a href="../index.html#books">All Books</a> · <a href="../index.html#challenge">Challenge</a> · <a href="../privacy.html">Privacy</a> · <a href="../terms.html">Terms</a></div>'

          for path in book_files:
              text = path.read_text(encoding='utf-8')
              original = text

              if nav_old not in text:
                  raise SystemExit(f'Expected nav marker missing in {path}')
              text = text.replace(nav_old, nav_new, 1)

              if footer_old not in text:
                  raise SystemExit(f'Expected footer marker missing in {path}')
              text = text.replace(footer_old, footer_new, 1)

              if 'seo-discovery-links' not in text:
                  if path.name in psych_files:
                      discovery = '<p class="section-copy seo-discovery-links">Explore more <a href="../psychological-mystery-books.html">psychological mystery books</a>, or browse all <a href="../kindle-unlimited-mystery-books.html">Kindle Unlimited mystery books</a> from JayTree Books.</p>'
                  else:
                      discovery = '<p class="section-copy seo-discovery-links">Browse all current <a href="../kindle-unlimited-mystery-books.html">Kindle Unlimited mystery books</a> from JayTree Books, each organized by its distinct story premise.</p>'

                  pattern = r'(<section class="book-section" id="about">.*?)(</section>)'
                  text, count = re.subn(pattern, lambda m: m.group(1) + discovery + m.group(2), text, count=1, flags=re.S)
                  if count != 1:
                      raise SystemExit(f'Could not add contextual discovery links in {path}')

              if path.name == 'second-draft.html':
                  old_meta = '<meta name="description" content="Nora helps people rehearse the hardest conversations of their lives—until the rehearsals start changing reality. Read Chapter One and continue with Kindle Unlimited.">'
                  new_meta = '<meta name="description" content="Nora helps people rehearse impossible conversations—until the rehearsals start changing reality. Read Chapter One and continue with Kindle Unlimited.">'
                  if old_meta not in text:
                      raise SystemExit('Expected Second Draft meta description not found')
                  text = text.replace(old_meta, new_meta, 1)

              if text == original:
                  raise SystemExit(f'No change produced for {path}')
              path.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          original = text

          amazon_link = '<a class="cta" href="https://www.amazon.com/stores/author/B0HG41STKM" target="_blank" rel="noopener" data-track="ku_home_amazon">Browse JayTree Books on Amazon</a>'
          ku_link = '<a class="cta" href="kindle-unlimited-mystery-books.html" data-track="ku_home_guide">Browse Kindle Unlimited Mysteries</a>'
          if ku_link not in text:
              if amazon_link not in text:
                  raise SystemExit('Homepage KU Amazon marker missing')
              text = text.replace(amazon_link, ku_link + '\n      ' + amazon_link, 1)

          books_marker = '<a class="case-files-detail-link" href="psychological-mystery-books.html" data-track="psychological_mystery_books">Psychological mystery books →</a>'
          books_ku = '<a class="case-files-detail-link" href="kindle-unlimited-mystery-books.html" data-track="kindle_unlimited_mystery_books">Kindle Unlimited mystery books →</a>'
          if books_ku not in text:
              if books_marker not in text:
                  raise SystemExit('Homepage psychological-mystery marker missing')
              text = text.replace(books_marker, books_marker + '<br>' + books_ku, 1)

          if text == original:
              raise SystemExit('No homepage change produced')
          index.write_text(text, encoding='utf-8')

          print('SEO internal-link cleanup complete.')

      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          for f in books/second-draft.html books/the-hollow-year.html books/the-hollow-bell.html books/the-absconding.html books/the-correction.html; do
            grep -q 'kindle-unlimited-mystery-books.html' "$f"
            grep -q 'psychological-mystery-books.html' "$f"
            grep -q 'seo-discovery-links' "$f"
          done
          grep -q 'kindle-unlimited-mystery-books.html' index.html
          grep -q 'Nora helps people rehearse impossible conversations' books/second-draft.html

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html books/*.html
          git diff --cached --quiet && exit 0
          git commit -m 'SEO: strengthen book discovery internal links'
          git push
