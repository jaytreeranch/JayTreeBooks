name: Mystery Case 001 Temporary QC

on:
  push:
    branches: [qc-case001-temp]
    paths:
      - '.qc-case001-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg tesseract-ocr >/dev/null

      - name: Download newest final release video
        run: |
          curl -L --fail --retry 3 \
            'https://github.com/jaytreeranch/JayTreeBooks/releases/download/mystery-case-001-qc/MysteryCase001-FINAL.mp4' \
            -o MysteryCase001-FINAL.mp4
          ls -lh MysteryCase001-FINAL.mp4
          sha256sum MysteryCase001-FINAL.mp4 > sha256.txt

      - name: Generate technical report
        run: |
          ffprobe -v error -show_entries format=filename,duration,size,bit_rate,format_name:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels,channel_layout -of json MysteryCase001-FINAL.mp4 > ffprobe.json
          ffmpeg -hide_banner -nostats -i MysteryCase001-FINAL.mp4 -filter_complex ebur128=peak=true -f null - 2> ebur128.txt || true
          tail -n 50 ebur128.txt > loudness_tail.txt

      - name: Generate visual inspection proxy
        run: |
          ffmpeg -y -i MysteryCase001-FINAL.mp4 \
            -vf "scale=640:-2,fps=10" \
            -c:v libx264 -preset veryfast -crf 31 \
            -c:a aac -b:a 64k -movflags +faststart \
            MysteryCase001_FINAL_QC_PROXY.mp4

      - name: Generate contact sheets
        run: |
          mkdir -p sheets
          ffmpeg -y -i MysteryCase001-FINAL.mp4 -vf "fps=1/10,scale=480:-2,tile=4x4" -vsync vfr sheets/contact_%02d.jpg
          ffmpeg -y -ss 300 -i MysteryCase001-FINAL.mp4 -t 61 -vf "fps=1/2,scale=480:-2,tile=5x6" -frames:v 1 sheets/final_minute.jpg
          ffmpeg -y -ss 285 -i MysteryCase001-FINAL.mp4 -t 55 -vf "fps=1/2,scale=480:-2,tile=5x6" -frames:v 1 sheets/receipt_window.jpg
          ffmpeg -y -ss 340 -i MysteryCase001-FINAL.mp4 -t 21 -vf "fps=1,scale=640:-2,tile=4x6" -frames:v 1 sheets/end_board_detail.jpg

      - name: OCR final board and captions
        run: |
          mkdir -p ocrframes
          ffmpeg -y -ss 330 -i MysteryCase001-FINAL.mp4 -t 31 -vf "fps=1/2,scale=1280:-2" ocrframes/f_%03d.png
          : > final_ocr.txt
          for f in ocrframes/*.png; do
            echo "===== $f =====" >> final_ocr.txt
            tesseract "$f" stdout --psm 11 2>/dev/null >> final_ocr.txt || true
            echo >> final_ocr.txt
          done

      - name: Upload QC package
        uses: actions/upload-artifact@v4
        with:
          name: mystery-case-001-final-qc-package
          path: |
            MysteryCase001_FINAL_QC_PROXY.mp4
            ffprobe.json
            loudness_tail.txt
            final_ocr.txt
            sha256.txt
            sheets/*.jpg
          compression-level: 0
          retention-days: 3
