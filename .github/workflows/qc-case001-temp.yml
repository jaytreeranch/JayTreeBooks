name: Mystery Case 001 Final Master

on:
  push:
    branches: [qc-case001-temp]
    paths:
      - '.qc-case001-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Download newest final release video
        run: |
          curl -L --fail --retry 3 \
            'https://github.com/jaytreeranch/JayTreeBooks/releases/download/mystery-case-001-qc/MysteryCase001-FINAL.mp4' \
            -o MysteryCase001-FINAL.mp4
          sha256sum MysteryCase001-FINAL.mp4 > source_sha256.txt
          ls -lh MysteryCase001-FINAL.mp4

      - name: Analyze compressed mix for two-pass loudness mastering
        run: |
          ffmpeg -hide_banner -nostats -i MysteryCase001-FINAL.mp4 \
            -map 0:a:0 \
            -af "acompressor=threshold=0.125:ratio=2:attack=20:release=250,loudnorm=I=-16:TP=-1.5:LRA=11:print_format=json" \
            -f null - 2> pass1.log || true
          python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path('pass1.log').read_text(errors='ignore')
          matches = re.findall(r'\{\s*"input_i".*?\}', text, re.S)
          if not matches:
              raise SystemExit('Could not find loudnorm JSON in pass1.log')
          block = matches[-1]
          vals = dict(re.findall(r'"([^"]+)"\s*:\s*"([^"]+)"', block))
          required = ['input_i','input_tp','input_lra','input_thresh','target_offset']
          missing = [k for k in required if k not in vals]
          if missing:
              raise SystemExit(f'Missing loudnorm metrics: {missing}')
          lines = [
              f"INPUT_I={vals['input_i']}",
              f"INPUT_TP={vals['input_tp']}",
              f"INPUT_LRA={vals['input_lra']}",
              f"INPUT_THRESH={vals['input_thresh']}",
              f"TARGET_OFFSET={vals['target_offset']}",
          ]
          pathlib.Path('loudnorm.env').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Create mastered MP4 without re-encoding video
        run: |
          source loudnorm.env
          FILTER="acompressor=threshold=0.125:ratio=2:attack=20:release=250,loudnorm=I=-16:TP=-1.5:LRA=11:measured_I=${INPUT_I}:measured_TP=${INPUT_TP}:measured_LRA=${INPUT_LRA}:measured_thresh=${INPUT_THRESH}:offset=${TARGET_OFFSET}:linear=false:print_format=summary"
          ffmpeg -y -i MysteryCase001-FINAL.mp4 \
            -map 0:v:0 -map 0:a:0 \
            -map_metadata 0 \
            -c:v copy \
            -af "$FILTER" \
            -c:a aac -b:a 256k \
            -movflags +faststart \
            MysteryCase001-PRODUCTION-LOCKED-MASTER.mp4
          ls -lh MysteryCase001-PRODUCTION-LOCKED-MASTER.mp4

      - name: Verify mastered audio and export specs
        run: |
          ffprobe -v error -show_entries format=filename,duration,size,bit_rate:stream=index,codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels -of json MysteryCase001-PRODUCTION-LOCKED-MASTER.mp4 > mastered_ffprobe.json
          ffmpeg -hide_banner -nostats -i MysteryCase001-PRODUCTION-LOCKED-MASTER.mp4 -filter_complex ebur128=peak=true -f null - 2> mastered_ebur128.txt || true
          tail -n 50 mastered_ebur128.txt > mastered_loudness.txt
          sha256sum MysteryCase001-PRODUCTION-LOCKED-MASTER.mp4 > mastered_sha256.txt

      - name: Upload mastered video
        uses: actions/upload-artifact@v4
        with:
          name: mystery-case-001-production-locked-master
          path: |
            MysteryCase001-PRODUCTION-LOCKED-MASTER.mp4
            mastered_ffprobe.json
            mastered_loudness.txt
            mastered_sha256.txt
            source_sha256.txt
            pass1.log
          compression-level: 0
          retention-days: 3
