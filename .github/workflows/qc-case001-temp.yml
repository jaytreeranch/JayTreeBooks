name: Mystery Case 001 Updated Final QC

on:
  push:
    branches: [qc-case001-temp]
    paths:
      - '.qc-case001-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Download updated final release video
        run: |
          curl -L --fail --retry 3 \
            'https://github.com/jaytreeranch/JayTreeBooks/releases/download/mystery-case-001-qc/MysteryCase001-FINAL-Updated.mp4' \
            -o MysteryCase001-FINAL-Updated.mp4
          sha256sum MysteryCase001-FINAL-Updated.mp4 > source_sha256.txt
          ls -lh MysteryCase001-FINAL-Updated.mp4

      - name: Measure export and loudness
        run: |
          ffprobe -v error -show_entries format=filename,duration,size,bit_rate,format_name:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels,channel_layout -of json MysteryCase001-FINAL-Updated.mp4 > ffprobe.json
          ffmpeg -hide_banner -nostats -i MysteryCase001-FINAL-Updated.mp4 -filter_complex ebur128=peak=true -f null - 2> ebur128.txt || true
          tail -n 50 ebur128.txt > loudness_tail.txt

      - name: Generate final-scene visual QC
        run: |
          mkdir -p sheets
          ffmpeg -y -ss 330 -i MysteryCase001-FINAL-Updated.mp4 -t 31 \
            -vf "fps=1/2,scale=640:-2,tile=4x4" -frames:v 1 sheets/final_scene_pushin.jpg
          ffmpeg -y -ss 340 -i MysteryCase001-FINAL-Updated.mp4 -t 21 \
            -vf "fps=1,scale=640:-2,tile=4x6" -frames:v 1 sheets/end_board_detail.jpg
          ffmpeg -y -ss 330 -i MysteryCase001-FINAL-Updated.mp4 -t 31 \
            -vf "scale=960:-2,fps=12" -c:v libx264 -preset veryfast -crf 28 -an sheets/final_scene_proxy.mp4

      - name: Upload updated final QC package
        uses: actions/upload-artifact@v4
        with:
          name: mystery-case-001-updated-final-qc
          path: |
            ffprobe.json
            loudness_tail.txt
            source_sha256.txt
            sheets/*
          compression-level: 0
          retention-days: 3
