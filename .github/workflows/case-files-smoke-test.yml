name: Case Files Signup Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/case-files-smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Submit verification signup and capture response
        shell: bash
        run: |
          set +e
          body_file="formsubmit-response.txt"
          http_code="$(curl -sS -o "$body_file.body" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/json' \
            --data-urlencode 'email=jaytreebooks@gmail.com' \
            --data-urlencode 'consent=Automated verification test' \
            --data-urlencode 'list=JayTree Case Files' \
            --data-urlencode 'source=assistant-smoke-test' \
            --data-urlencode '_subject=JayTree Case Files verification test' \
            --data-urlencode '_template=table' \
            --data-urlencode '_captcha=false' \
            https://formsubmit.co/ajax/jaytreebooks@gmail.com)"
          {
            echo "HTTP_STATUS=$http_code"
            echo "---BODY---"
            cat "$body_file.body"
          } > "$body_file"
          cat "$body_file"
          exit 0

      - name: Upload response
        uses: actions/upload-artifact@v4
        with:
          name: case-files-formsubmit-response
          path: formsubmit-response.txt
          retention-days: 1
