name: JayTree SEO Content Cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/seo_content_cleanup.py"
      - "scripts/apply_entity_seo.py"
      - "scripts/build_reader_growth_site.py"
      - "scripts/finalize_reader_growth.py"
      - "scripts/apply_site_improvements.py"
      - "index.html"
      - "about.html"
      - "books/*.html"
      - "chapters/*.html"
      - "mystery-books.html"
      - "psychological-mystery-books.html"
      - "kindle-unlimited-mystery-books.html"
      - "supernatural-mystery-books.html"
      - "small-town-mystery-books.html"
      - "cold-case-mystery-books.html"
      - "case-files.html"
      - "animated-series.html"
      - "styles.css"
      - "sitemap.xml"
      - ".github/workflows/seo-content-cleanup.yml"

permissions:
  contents: write

concurrency:
  group: jaytree-seo-content-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile SEO maintenance
        run: python -m py_compile scripts/apply_entity_seo.py scripts/seo_content_cleanup.py

      - name: Apply entity SEO
        run: python scripts/apply_entity_seo.py

      - name: Apply SEO cleanup and sitemap refresh
        run: python scripts/seo_content_cleanup.py

      - name: Validate idempotent SEO output
        run: |
          python scripts/apply_entity_seo.py
          python scripts/seo_content_cleanup.py

      - name: Verify workflow files untouched
        shell: bash
        run: |
          if ! git diff --quiet -- .github/workflows; then
            echo "::error::SEO cleanup must never modify .github/workflows/."
            git diff -- .github/workflows
            exit 1
          fi

      - name: Commit SEO cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          if ! git diff --cached --quiet -- .github/workflows; then
            echo "::error::SEO cleanup attempted to stage .github/workflows/."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "SEO cleanup is already current."
            exit 0
          fi
          git commit -m "Clean up JayTree SEO metadata and schema"
          git pull --rebase origin main
          git push
