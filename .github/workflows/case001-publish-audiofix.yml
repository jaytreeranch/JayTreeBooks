name: Publish Case 001 Audio-Fixed Final

on:
  push:
    branches:
      - case001-final-update-qc
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download successful QC artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh run download 33548553704 -n case001-final-update-qc-v2 -D input
          test -f input/Mystery_Case_001_PRODUCTION_LOCKED_FINAL.mp4

      - name: Apply transparent audio safety trim
        run: |
          ffmpeg -y -hide_banner \
            -i input/Mystery_Case_001_PRODUCTION_LOCKED_FINAL.mp4 \
            -map 0:v:0 -map 0:a:0 \
            -c:v copy \
            -af 'volume=-0.5dB' \
            -c:a aac -b:a 320k \
            -movflags +faststart \
            Mystery_Case_001_PRODUCTION_LOCKED_FINAL.mp4

      - name: Verify final audio and video
        run: |
          ffprobe -v error \
            -show_entries format=filename,duration,size,bit_rate:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels,channel_layout \
            -of json Mystery_Case_001_PRODUCTION_LOCKED_FINAL.mp4 > final_ffprobe.json
          ffmpeg -hide_banner -nostats \
            -i Mystery_Case_001_PRODUCTION_LOCKED_FINAL.mp4 \
            -filter_complex ebur128=peak=true -f null - \
            2> final_loudness_full.txt || true
          tail -n 30 final_loudness_full.txt > final_loudness.txt
          sha256sum Mystery_Case_001_PRODUCTION_LOCKED_FINAL.mp4 > final_sha256.txt
          cat final_loudness.txt

      - name: Publish to existing QC release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload mystery-case-001-qc \
            Mystery_Case_001_PRODUCTION_LOCKED_FINAL.mp4 \
            --clobber

      - name: Upload final verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: case001-audiofixed-final
          compression-level: 0
          retention-days: 7
          path: |
            Mystery_Case_001_PRODUCTION_LOCKED_FINAL.mp4
            final_ffprobe.json
            final_loudness.txt
            final_sha256.txt
