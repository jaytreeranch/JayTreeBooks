name: Build social media assets

on:
  push:
    branches: ["main"]
    paths:
      - "images/**"
      - "scripts/build_social_images.py"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-media-assets
  cancel-in-progress: true

jobs:
  build-social-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Facebook and Instagram cover JPEGs
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/build_social_images.py

      - name: Commit generated social media assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/social/*.jpg

          if git diff --cached --quiet; then
            echo "Social media JPEGs are already up to date."
            exit 0
          fi

          git commit -m "Update generated social media cover assets"
          git push
